name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/bridge.js
      - run: node --check src/orchestrator/mock.mjs
      - run: node --check src/orchestrator/dify.mjs
      - run: node checks.mjs
