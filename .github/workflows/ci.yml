name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server.mjs
      - run: node --check src/learning/action-gate.mjs
      - run: node --check src/learning/learner-turn.mjs
      - run: node --check src/orchestrator/mock.mjs
      - run: npm test
      - run: npm run smoke
