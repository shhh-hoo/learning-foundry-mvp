<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculation Trainer</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fff;color:#222}.box{max-width:640px;margin:auto}input{font:inherit;width:100%;padding:12px;border:1px solid #ccc;border-radius:12px;box-sizing:border-box}button{font:inherit;cursor:pointer;padding:11px 16px;border:0;border-radius:12px;background:#111;color:white;margin-top:12px}.muted{color:#666}.result{margin-top:16px;padding:12px;border-radius:12px;background:#f4f4f1}</style></head><body><main class="box"><div class="muted">ComponentAsset · Calculation Trainer · v1.0.0</div><h1>Scale a proportional relationship</h1><p>If 6 red tokens correspond to 3 blue tokens, how many red tokens correspond to 5 blue tokens?</p><input id="answer" inputmode="decimal" placeholder="Your answer"><button id="submit">Submit Attempt</button><div id="result"></div></main><script>
let runtimeSessionId="pending";let initialized=false;
function make(type,payload={}){return{protocol:"foundry-component",protocolVersion:"0.1",messageId:crypto.randomUUID(),runtimeSessionId,type,timestamp:new Date().toISOString(),payload}}
function emit(type,payload={}){parent.postMessage(make(type,payload),"*")}
window.addEventListener("message",event=>{const m=event.data;if(!m||m.protocol!=="foundry-component"||m.protocolVersion!=="0.1")return;if(m.type==="FOUNDRY_INIT"){runtimeSessionId=m.runtimeSessionId;initialized=true;emit("COMPONENT_INITIALIZED",{});}});
document.querySelector("#answer").addEventListener("input",event=>{if(initialized)emit("STATE_CHANGED",{state:{answer:event.target.value}})});
document.querySelector("#submit").addEventListener("click",()=>{if(!initialized)return;const raw=document.querySelector("#answer").value;const value=Number(raw);const correct=Math.abs(value-10)<1e-9;emit("ATTEMPT_SUBMITTED",{attempt:{response:{answer:raw},correct,assistanceUsed:[],stateSnapshot:{answer:raw}}});document.querySelector("#result").innerHTML=`<div class="result">${correct?"Correct — the scale factor is 5/3, so 6 × 5/3 = 10.":"Try comparing the red-to-blue ratio before scaling."}</div>`;emit("COMPONENT_COMPLETED",{completionReason:"attempt_submitted"});});
parent.postMessage({protocol:"foundry-component",protocolVersion:"0.1",messageId:crypto.randomUUID(),runtimeSessionId:"pending",type:"COMPONENT_READY",timestamp:new Date().toISOString(),payload:{supportedProtocolVersions:["0.1"]}},"*");
</script></body></html>
