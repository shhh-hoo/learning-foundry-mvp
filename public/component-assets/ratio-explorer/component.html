<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ratio Explorer</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:24px;background:#fff;color:#222}.box{max-width:640px;margin:auto}.choice{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:12px;background:#fafafa}.choice.selected{border-color:#111;background:#eee}button{font:inherit;cursor:pointer}.submit{padding:11px 16px;border:0;border-radius:12px;background:#111;color:white;margin-top:10px}.muted{color:#666}.result{margin-top:16px;padding:12px;border-radius:12px;background:#f4f4f1}</style></head><body><main class="box"><div class="muted">ComponentAsset · Ratio Explorer · v1.0.0</div><h1>Which relationship keeps the same ratio?</h1><p>Start with 2 circles for every 1 square.</p><button class="choice" data-id="four-two">4 circles for 2 squares</button><button class="choice" data-id="four-three">4 circles for 3 squares</button><button class="choice" data-id="six-four">6 circles for 4 squares</button><button id="submit" class="submit" disabled>Submit Attempt</button><div id="result"></div></main><script>
let runtimeSessionId="pending";let selected=null;let initialized=false;
function message(type,payload={}){return{protocol:"foundry-component",protocolVersion:"0.1",messageId:crypto.randomUUID(),runtimeSessionId,type,timestamp:new Date().toISOString(),payload}}
function emit(type,payload={}){parent.postMessage(message(type,payload),"*")}
window.addEventListener("message",event=>{const m=event.data;if(!m||m.protocol!=="foundry-component"||m.protocolVersion!=="0.1")return;if(m.type==="FOUNDRY_INIT"){runtimeSessionId=m.runtimeSessionId;initialized=true;emit("COMPONENT_INITIALIZED",{});}});
document.querySelectorAll(".choice").forEach(button=>button.addEventListener("click",()=>{selected=button.dataset.id;document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x===button));document.querySelector("#submit").disabled=false;if(initialized)emit("LEARNING_EVENT",{eventName:"choice_selected",data:{choiceId:selected}});}));
document.querySelector("#submit").addEventListener("click",()=>{if(!initialized||!selected)return;const correct=selected==="four-two";emit("ATTEMPT_SUBMITTED",{attempt:{response:{selectedChoiceId:selected},correct,assistanceUsed:[],stateSnapshot:{selected}}});document.querySelector("#result").innerHTML=`<div class="result">${correct?"Yes — both quantities were scaled by the same factor.":"Not yet — compare how each quantity was scaled."}</div>`;emit("COMPONENT_COMPLETED",{completionReason:"attempt_submitted"});});
parent.postMessage({protocol:"foundry-component",protocolVersion:"0.1",messageId:crypto.randomUUID(),runtimeSessionId:"pending",type:"COMPONENT_READY",timestamp:new Date().toISOString(),payload:{supportedProtocolVersions:["0.1"]}},"*");
</script></body></html>
